name: Deploy YuPhotos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuphotos-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install gallery and builder dependencies
        run: pnpm --filter '@afilmory/web...' --filter '@afilmory/monorepo...' install --frozen-lockfile
      - name: Check deployment configuration
        run: pnpm exec tsx --test scripts/yuphotos-config.test.ts
      - name: Generate photo manifest and thumbnails
        env:
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: pnpm build:manifest -- --no-ui
      - name: Build static gallery
        run: pnpm --filter @afilmory/web exec vite build
      - name: Check gallery types
        run: pnpm --filter @afilmory/web type-check
      - name: Prepare photo deep-link fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - name: Verify Pages artifact
        run: node scripts/verify-yuphotos-build.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy gallery
        id: deployment
        uses: actions/deploy-pages@v4
